<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReihWidget SDK — Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f7; color: #1a1a2e; }
    .hero { max-width: 640px; margin: 80px auto; padding: 0 24px; text-align: center; }
    h1 { font-size: 32px; margin-bottom: 12px; }
    p { font-size: 16px; color: #666; margin-bottom: 24px; line-height: 1.6; }
    code { background: #e8e8ee; padding: 2px 6px; border-radius: 4px; font-size: 14px; }
    .badge { display: inline-block; background: #6C63FF; color: #fff; padding: 4px 12px; border-radius: 12px; font-size: 12px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="badge">Demo Page</div>
    <h1>ReihWidget SDK</h1>
    <p>
      This page demonstrates the embeddable chat widget.
      Click the floating button in the bottom-right corner to open the chat.
    </p>
    <p>
      Configure via <code>window.reihWidgetConfig</code> before the script loads.
    </p>
  </div>

  <script src="env.js"></script>

  <!-- Widget Configuration -->
  <script>
    var env = window.__REIH_ENV__ || {};
    window.reihWidgetConfig = {
      clientId: env.clientId || 'demo-client-001',
      bearerToken: env.bearerToken,
      mediaId: env.mediaId,
      apiBaseUrl: env.apiBaseUrl,
      apiBaseUrlV2: env.apiBaseUrlV2,
      wsBaseUrl: env.wsBaseUrl,
      apiVersion: env.apiVersion || 'v3',
      primaryColor: '#6C63FF',
      title: 'REimagineHome',
      subtitle: 'AI Design Assistant',
      welcomeTitle: 'Hi there! 👋',
      welcomeDescription: 'Upload a photo of your space and tell us how you\'d like to reimagine it.',
      placeholder: 'Describe what you want to change...',
      position: 'bottom-right',
      // autoOpen: 3000,  // auto-open after 3 seconds
      // hideTrigger: true, // hide the floating button
    };
  </script>

  <!-- Load Widget (use dist/reih-widget.js in production) -->
  <script src="/dist/reih-widget.js"></script>

  <!-- Listen for widget events -->
  <script>
    window.addEventListener('reihwidget:ready', () => {
      console.log('[Demo] Widget is ready');
    });
  </script>
</body>
</html>
