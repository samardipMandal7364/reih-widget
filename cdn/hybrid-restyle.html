<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hybrid Widget — Restyle Mode</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f9fafb;
    }
    .listing {
      max-width: 720px; margin: 0 auto; padding: 48px 24px;
    }
    .listing h1 { font-size: 24px; margin-bottom: 6px; }
    .listing .price { font-size: 20px; color: #6C63FF; font-weight: 700; margin-bottom: 16px; }
    .listing img {
      width: 100%; border-radius: 12px; margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }
    .listing p { color: #374151; line-height: 1.6; margin-bottom: 16px; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
    .badge {
      display: inline-block; padding: 3px 8px; border-radius: 6px;
      background: #dcfce7; color: #166534; font-size: 12px; font-weight: 600;
      margin-bottom: 16px;
    }
    .cta-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
    button.cta {
      padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;
      font: 600 14px/1.4 system-ui, sans-serif; color: #fff; background: #6C63FF;
    }
    .status {
      margin-top: 16px; padding: 12px 16px; border-radius: 8px; font-size: 14px; line-height: 1.5;
    }
    .status--error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .status--ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .status--info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
  </style>
</head>
<body>
  <div class="listing">
    <span class="badge">hybrid · iframe · restyle · CDN</span>
    <h1>123 Maple Drive</h1>
    <p class="price">$475,000</p>
    <img id="listing-img"
         src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=800&q=80"
         alt="Property photo" />
    <p>Spacious 3-bedroom home with modern kitchen and backyard. Click the button below to restyle this property using AI.</p>

    <div class="cta-row">
      <button class="cta" onclick="window.reihWidget.open()">Restyle with AI</button>
      <button class="cta" onclick="window.reihWidget.close()" style="background:#ef4444">Close</button>
    </div>

    <div id="status" class="status status--info"></div>
  </div>

  <script src="./env.js" onerror="console.log('[demo] env.js not found — using URL params only')"></script>

  <script>
    var API_PRESETS = {
      prod: {
        apiBaseUrl: 'https://api.reimaginehome.ai/v3',
        apiBaseUrlV2: 'https://api.reimaginehome.ai/v2',
        wsBaseUrl: 'wss://ws.reimaginehome.ai/prod',
      },
      dev: {
        apiBaseUrl: 'https://dev-api.reimaginehome.ai/v3',
        apiBaseUrlV2: 'https://dev-api.reimaginehome.ai/v2',
        wsBaseUrl: 'wss://bcbss17qsc.execute-api.us-west-2.amazonaws.com/dev',
      },
    };

    function readParams() {
      var merged = new URLSearchParams(window.location.search);
      var hash = window.location.hash.replace(/^#/, '');
      if (hash) {
        var hashParams = new URLSearchParams(hash);
        hashParams.forEach(function (value, key) {
          if (!merged.has(key)) merged.set(key, value);
        });
      }
      return merged;
    }

    function getParam() {
      for (var i = 0; i < arguments.length; i++) {
        var raw = params.get(arguments[i]);
        if (raw != null && raw !== '') {
          try { return decodeURIComponent(raw); } catch (_) { return raw; }
        }
      }
      return undefined;
    }

    function setStatus(message, type) {
      var el = document.getElementById('status');
      el.textContent = message;
      el.className = 'status status--' + (type || 'info');
    }

    var env = window.__REIH_ENV__ || {};
    var cdnBase = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '');
    var params = readParams();
    var apiEnv = getParam('apiEnv') || env.apiEnv || 'dev';
    var preset = API_PRESETS[apiEnv] || API_PRESETS.dev;

    var tenantId = env.tenantId || env.clientId || getParam('tenantId', 'clientId');
    var clientId = env.clientId || env.tenantId || getParam('clientId', 'tenantId');
    var projectId = getParam('projectId', 'project_id') || env.projectId;
    var mediaId = getParam('mediaId', 'media_id') || env.mediaId;
    var bearerToken = getParam('bearerToken', 'token') || env.bearerToken;

    if (!projectId || !mediaId || !bearerToken) {
      setStatus(
        'Missing required params: projectId, mediaId, and bearerToken (or token). ' +
        'Image URL format: cdn-2.reimaginehome.ai/{env}/{projectId}/{mediaId}/original.jpg',
        'error'
      );
    } else {
      setStatus(
        'Config loaded for project ' + projectId + ' / media ' + mediaId + ' using ' + apiEnv + ' API.',
        'ok'
      );
    }

    tenantId = tenantId || clientId || 'demo-tenant';
    clientId = clientId || tenantId || 'demo-tenant';

    window.reihWidgetConfig = {
      tenantId: tenantId,
      clientId: clientId,
      mode: 'restyle',
      hideTrigger: true,
      lazyInit: true,
      autoInit: false,
      autoOpen: false,
      deferWidgetUntilLoader: true,
      loaderText: 'Loading',
      loaderMinMs: 5000,
      primaryColor: '#6C63FF',
      apiBaseUrl: getParam('apiBaseUrl') || env.apiBaseUrl || preset.apiBaseUrl,
      apiBaseUrlV2: getParam('apiBaseUrlV2') || env.apiBaseUrlV2 || preset.apiBaseUrlV2,
      wsBaseUrl: getParam('wsBaseUrl') || env.wsBaseUrl || preset.wsBaseUrl,
      apiVersion: getParam('apiVersion') || env.apiVersion || 'v3',
      apiEnv: apiEnv,
      cdnEnv: getParam('cdnEnv') || apiEnv,
      projectId: projectId,
      mediaId: mediaId,
      bearerToken: bearerToken,
      embedBaseUrl: cdnBase,
    };

    window.addEventListener('reihwidget:media-loaded', function (e) {
      console.log('[demo] media loaded', e.detail);
      if (e.detail.url) document.getElementById('listing-img').src = e.detail.url;
      setStatus('Media loaded successfully.', 'ok');
    });

    window.addEventListener('reihwidget:media-error', function (e) {
      console.error('[demo] media error', e.detail);
      setStatus('Media failed to load: ' + (e.detail && e.detail.message ? e.detail.message : 'Unknown error'), 'error');
    });

    window.addEventListener('reihwidget:ready', function (e) {
      console.log('[demo] widget ready', e.detail);
    });
  </script>
  <script src="./reih-loader.js"></script>
</body>
</html>
